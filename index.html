<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow Pro - Personal Finance Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        /* Ambient Glow Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }
        .orb-1 { width: 350px; height: 350px; background: #6366f1; top: -50px; left: -50px; }
        .orb-2 { width: 300px; height: 300px; background: #10b981; bottom: 5px; right: -50px; }
        .orb-3 { width: 250px; height: 250px; background: #ec4899; top: 40%; left: 30%; }

        /* Glassmorphism Styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        /* Pull to Refresh Bar Styling */
        #ptr-container {
            position: fixed;
            top: -75px;
            left: 0;
            right: 0;
            height: 65px;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.2s ease;
            pointer-events: none;
            opacity: 0;
        }

        #ptr-box {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="p-3 md:p-6 relative">

    <!-- PULL TO REFRESH INDICATOR -->
    <div id="ptr-container">
        <div id="ptr-box" class="flex items-center gap-3 px-5 py-2.5 rounded-full text-xs font-semibold text-white">
            <div id="ptr-icon-wrap" class="w-6 h-6 flex items-center justify-center text-indigo-400 transition-transform duration-200">
                <i id="ptr-icon" class="fa-solid fa-arrow-down text-sm"></i>
            </div>
            <span id="ptr-text" class="tracking-wide">Pull to refresh...</span>
        </div>
    </div>

    <!-- Ambient background lights -->
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="max-w-7xl mx-auto relative z-10 space-y-6" id="dashboard-content">

        <!-- HEADER -->
        <header class="glass-card rounded-2xl p-4 md:p-6 flex flex-col md:flex-row justify-between items-center gap-4">

                </div>
                <div>

                    <p class="text-xs md:text-sm text-slate-400">Your Personal Finance & Loan Dashboard</p>
                </div>
            </div>
