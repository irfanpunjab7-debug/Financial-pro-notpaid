<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="./manifest.json">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinanceFlow Pro - Personal Finance Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- html2pdf.js for PDF export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        darkBg: '#0f172a',
                        cardBg: 'rgba(30, 41, 59, 0.7)',
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background-color: #0b0f19;
            color: #f8fafc;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            touch-action: pan-y;
        }

        /* Ambient Glow Background Orbs */
        .orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(90px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }
        .orb-1 { width: 350px; height: 350px; background: #6366f1; top: -50px; left: -50px; }
        .orb-2 { width: 300px; height: 300px; background: #10b981; bottom: 5px; right: -50px; }
        .orb-3 { width: 250px; height: 250px; background: #ec4899; top: 40%; left: 30%; }

        /* Glassmorphism Styling */
        .glass-card {
            background: rgba(30, 41, 59, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-modal {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
        }
        .glass-input:focus {
            outline: none;
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.3);
        }

        /* Pull to Refresh Bar Styling */
        #ptr-container {
            position: fixed;
            top: -75px;
            left: 0;
            right: 0;
            height: 65px;
            z-index: 99;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.1, 0.8, 0.3, 1), opacity 0.2s ease;
            pointer-events: none;
            opacity: 0;
        }

        #ptr-box {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 0 15px rgba(99, 102, 241, 0.2);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.5); }
        ::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.4); }
    </style>
</head>
<body class="p-3 md:p-6 relative">

    <!-- APP LOCK SCREEN MODAL -->
    <div id="app-lock-screen" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-xl hidden">
        <div class="glass-modal w-full max-w-sm rounded-2xl p-6 text-center space-y-4 shadow-2xl">
            <div class="w-14 h-14 bg-indigo-500/20 text-indigo-400 rounded-full flex items-center justify-center mx-auto text-2xl border border-indigo-500/30">
                <i class="fa-solid fa-lock"></i>
            </div>
            <div>
                <h3 class="text-xl font-bold text-white">App Locked</h3>
                <p class="text-xs text-slate-400 mt-1">اپنا 4 ہندسوں کا پن کوڈ درج کریں</p>
            </div>
            
            <div class="space-y-3">
                <input type="password" id="lock-pin-input" maxlength="4" placeholder="••••" class="w-full text-center glass-input px-3 py-3 rounded-xl text-xl tracking-widest font-bold">
                <button onclick="verifyAppLock()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white py-2.5 rounded-xl text-xs font-semibold shadow-lg transition">
                    انلاک کریں (Unlock)
                </button>
                <button onclick="setupNewPin()" class="text-[11px] text-slate-400 hover:text-indigo-300 underline block mx-auto">
                    نیا پن کوڈ سیٹ کریں / تبدیل کریں
                </button>
            </div>
        </div>
    </div>

    <!-- PULL TO REFRESH INDICATOR -->
    <div id="ptr-container">
        <div id="ptr-box" class="flex items-center gap-3 px-5 py-2.5 rounded-full text-xs font-semibold text-white">
            <div id="ptr-icon-wrap" class="w-6 h-6 flex items-center justify-center text-indigo-400 transition-transform duration-200">
                <i id="ptr-icon" class="fa-solid fa-arrow-down
